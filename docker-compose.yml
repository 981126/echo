# echo — NAS 部署（M3 完善）
# 项目名由 deploy.sh 的 `-p echo` / 仓库目录名固定；不写顶层 name，兼容 fnOS 上的 Compose v1
services:
  echo:
    build: .
    # R-234：固定镜像 tag，部署脚本可保留 echo:previous 做人工回滚
    image: echo:local
    container_name: echo
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
      # R-234：容器内路径固定，避免把宿主机路径（如 /Users/...）搬进 .env 后数据落进容器层
      - ECHO_DATA_DIR=/app/data
      - ECHO_DB_PATH=/app/data/echo.db
    volumes:
      # 宿主机数据目录：NAS 在 .env 配绝对路径，如 /vol1/1000/docker/echo/data
      - "${ECHO_HOST_DATA_DIR:-./data}:/app/data"
      - ./requirements:/app/requirements
      - ./docs:/app/docs:ro
    healthcheck:
      # R-144 A：python:3.12-slim 里**没有 curl**，用显式 curl 的健康检查会永久 unhealthy；
      # 改用 python 自带 urllib（python 镜像必然有 python）。
      test:
        - CMD
        - python
        - -c
        - "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=5).status == 200 else 1)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s   # 首次启动要建表/迁移/seed 默认提示词，给它时间
